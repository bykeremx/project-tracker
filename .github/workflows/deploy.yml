# Laravel 13 CI/CD — test geçmeden FTP'ye çıkılmaz.
#
# GitHub Actions klasör adı "workflows" (çoğul) olmak zorunda;
# aksi halde bu dosya hiç çalışmaz.
#
# FTP bilgilerini YAML'a yazma. Repo → Settings → Secrets and variables → Actions
# altına şunları ekle:
#
#   FTP_SERVER       örn. ftp.ornek.com
#   FTP_USERNAME     FTP kullanıcı adı
#   FTP_PASSWORD     FTP şifresi
#   FTP_PORT         isteğe bağlı, varsayılan 21
#   FTP_PROTOCOL     isteğe bağlı: ftp | ftps | ftps-legacy
#   FTP_SERVER_DIR   sunucudaki Laravel kökü, / ile bitsin
#                    örn. public_html/  veya  domains/ornek.com/
#
# .env asla yüklenmez. Üretim .env dosyasını sunucuda bir kez elle oluştur.
# document root = public/ olmalı (vendor ve app bir üstte durur).
# FTP ile artisan çalışmaz; migrate'i hosting panelinden veya SSH ile sen çalıştır.

name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v5

      - name: PHP 8.3 kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, ctype, fileinfo, tokenizer, xml, bcmath, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Composer önbelleği
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: PHP bağımlılıklarını kur
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Test ortamını hazırla
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Pest testlerini çalıştır
        run: php artisan test

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Vite derlemesini doğrula
        run: |
          npm ci
          npm run build

  deploy:
    name: FTP ile yayınla
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
      FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}

    steps:
      - name: FTP secret kontrolü
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "FTP_SERVER, FTP_USERNAME ve FTP_PASSWORD secret'larını ekle."
            exit 1
          fi

      - name: Depoyu çek
        uses: actions/checkout@v5

      - name: PHP 8.3 kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, ctype, fileinfo, tokenizer, xml, bcmath
          coverage: none
          tools: composer:v2

      - name: Üretim vendor kur
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Ön yüz varlıklarını derle
        run: |
          npm ci
          npm run build

      - name: FTP ile gönder
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          port: ${{ env.FTP_PORT || 21 }}
          protocol: ${{ env.FTP_PROTOCOL || 'ftp' }}
          server-dir: ${{ env.FTP_SERVER_DIR || './' }}
          local-dir: ./
          dangerous-clean-slate: false
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.backup
            **/.env.production
            **/.cursor/**
            **/.cursorrules
            **/.idea/**
            **/.vscode/**
            **/.phpunit.cache/**
            **/node_modules/**
            **/tests/**
            **/phpunit.xml
            **/public/hot
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/*.key
